# Savage Worlds Charakter-Generator - Projekt-Konfiguration
# pyproject.toml - Python Paket-Definition

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

# =============================================================================
# PROJEKT-METADATEN
# =============================================================================

[project]
name = "savage-worlds-character-generator"
version = "0.5.4.0"
description = "Moderner Charakter-Generator für das Savage Worlds Rollenspielsystem"
readme = "README.md"
license = {text = "CC BY-NC-SA 4.0"}
authors = [
    {name = "Jean-Michel Fenske", email = "thallion81@gmail.com"},
]
keywords = [
    "savage worlds",
    "rpg", 
    "character generator",
    "tabletop",
    "gaming",
    "kivymd"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Games/Entertainment :: Role-Playing",
    "License :: OSI Approved",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"

# Haupt-Dependencies (entspricht requirements.txt)
dependencies = [
    "kivymd @ https://github.com/kivymd/KivyMD/archive/master.zip",
    "kivy>=2.1.0,<2.3.0",
    "reportlab>=3.6.0",
    "Pillow>=8.0.0",
    "python-dateutil>=2.8.0",
    "pypiwin32>=223; sys_platform=='win32'",
]

# URLs für das Projekt
[project.urls]
Homepage = "https://github.com/Thallion/Savage-Worlds-Charakter-Generator-deutsch"
Repository = "https://github.com/Thallion/Savage-Worlds-Charakter-Generator-deutsch.git"
"Bug Tracker" = "https://github.com/Thallion/Savage-Worlds-Charakter-Generator-deutsch/issues"

# Entry Points für Kommandozeilen-Start
[project.scripts]
savage-worlds-generator = "main:main"

# =============================================================================
# SETUPTOOLS KONFIGURATION
# =============================================================================

[tool.setuptools]
# Packages automatisch finden
packages = ["models", "views", "controllers", "functions", "data"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.png", "*.jpg", "*.svg", "*.ttf", "*.kv"]