name: Build Android APK

on:
  workflow_dispatch:
  # push:
  #   branches: [ main, dev_unstable ]
  # pull_request:
  #   branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          python3-dev \
          python3-pip \
          python3-venv \
          libffi-dev \
          libssl-dev \
          libjpeg-dev \
          zlib1g-dev \
          libfreetype6-dev \
          liblcms2-dev \
          libwebp-dev \
          tcl8.6-dev \
          tk8.6-dev \
          python3-tk \
          libharfbuzz-dev \
          libfribidi-dev \
          libxcb1-dev \
          openjdk-17-jdk \
          unzip \
          zip \
          autotools-dev \
          automake \
          autoconf \
          libtool \
          pkg-config

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer
        pip install cython

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Cache Buildozer build directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-build-${{ hashFiles('buildozer.spec') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildozer-build-${{ hashFiles('buildozer.spec') }}-
          ${{ runner.os }}-buildozer-build-

    - name: Setup Java 17 for Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk
        sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java
        sudo update-alternatives --set javac /usr/lib/jvm/java-17-openjdk-amd64/bin/javac
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        java -version

    - name: Setup Android SDK
      run: |
        # Create Android SDK directory structure
        mkdir -p ~/.buildozer/android/sdk
        
        # Download and setup Android SDK command line tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mkdir -p ~/.buildozer/android/sdk/cmdline-tools/latest
        mv cmdline-tools/* ~/.buildozer/android/sdk/cmdline-tools/latest/
        
        # Setup environment
        export ANDROID_HOME=~/.buildozer/android/sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        
        # Create legacy tools directory structure that buildozer expects
        mkdir -p ~/.buildozer/android/sdk/tools/bin
        ln -sf ~/.buildozer/android/sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/sdk/tools/bin/sdkmanager
        ln -sf ~/.buildozer/android/sdk/cmdline-tools/latest/bin/avdmanager ~/.buildozer/android/sdk/tools/bin/avdmanager
        
        # Accept licenses and install necessary packages
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

    - name: Build with Buildozer
      run: |
        # Set environment variables
        export ANDROID_HOME=~/.buildozer/android/sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/tools/bin:$PATH
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        
        # Build the APK
        buildozer android debug
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        ANDROID_HOME: ~/.buildozer/android/sdk
        ANDROID_SDK_HOME: ~/.buildozer/android/sdk
        ANDROID_NDK_HOME: ~/.buildozer/android/ndk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: savage-worlds-generator-debug-apk
        path: bin/*.apk
        retention-days: 30

    - name: List generated files
      run: |
        echo "Generated files in bin/:"
        ls -la bin/ || echo "No bin directory found"
        echo "Build info:"
        find . -name "*.apk" -type f -exec ls -la {} \; || echo "No APK files found"

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Download APK artifact
      uses: actions/download-artifact@v4
      with:
        name: savage-worlds-generator-debug-apk
        path: ./apk/
        
    - name: Get version from buildozer.spec
      id: get_version
      run: |
        VERSION=$(grep "^version" buildozer.spec | cut -d'=' -f2 | tr -d ' ')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Savage Worlds Generator v${{ steps.get_version.outputs.version }}
        draft: false
        prerelease: false
        files: ./apk/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}