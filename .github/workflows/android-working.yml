name: Build Android APK (Working)

on:
  workflow_dispatch:
  push:
    branches: [ dev_unstable ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python 3.9 (more stable for buildozer)
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Create minimal main.py for testing
      run: |
        cat > main.py << 'EOF'
        from kivy.app import App
        from kivy.uix.label import Label

        class SavageWorldsApp(App):
            def build(self):
                return Label(text='Savage Worlds Generator\nVersion 0.5.5.8\nBuild successful!')

        if __name__ == '__main__':
            SavageWorldsApp().run()
        EOF

    - name: Create working buildozer.spec
      run: |
        cat > buildozer-working.spec << 'EOF'
        [app]
        title = Savage Worlds Test
        package.name = savageworlds
        package.domain = com.github.thallion
        source.dir = .
        source.include_exts = py,png,jpg,jpeg,json
        source.exclude_dirs = tests,bin,venv,.buildozer,__pycache__,.git,.github
        version = 0.5.5.8
        requirements = python3==3.9.19,kivy==2.1.0
        presplash.filename = %(source.dir)s/assets/charbogen_hintergrund.jpg
        icon.filename = %(source.dir)s/assets/Savage-Worlds-Fanprodukt-Logo.png

        [buildozer]
        log_level = 1

        [app]
        orientation = landscape
        fullscreen = 0

        android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE
        android.api = 30
        android.minapi = 21
        android.archs = armeabi-v7a
        android.accept_sdk_license = True
        android.skip_update = True
        p4a.branch = master
        EOF

    - name: Build with Buildozer
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        command: buildozer -f buildozer-working.spec android debug
        buildozer_version: 1.4.0

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: savage-worlds-working-apk
        path: ${{ steps.buildozer.outputs.filename }}

    - name: Show result
      run: |
        echo "✅ Build successful!"
        echo "APK: ${{ steps.buildozer.outputs.filename }}"
        file ${{ steps.buildozer.outputs.filename }}
        ls -la bin/