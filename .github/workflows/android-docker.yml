name: Build Android APK - Docker Only

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release
      use_cache:
        description: 'Use build cache'
        required: false
        default: true
        type: boolean
  push:
    branches: [ main, dev_unstable ]
    paths:
      - 'main.py'
      - 'views/**'
      - 'buildozer.spec'
      - '.github/workflows/android-docker.yml'

jobs:
  build-docker:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📱 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🐋 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 📂 Cache Docker layers and buildozer
      if: ${{ github.event.inputs.use_cache != 'false' }}
      uses: actions/cache@v3
      with:
        path: |
          /tmp/.buildx-cache
          ~/.buildozer
        key: ${{ runner.os }}-docker-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-docker-buildozer-

    - name: 🔧 Prepare build environment
      run: |
        echo "BUILD_MODE=${{ github.event.inputs.build_mode || 'debug' }}" >> $GITHUB_ENV
        echo "TIMESTAMP=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV
        
        # Erstelle Build-Verzeichnis
        mkdir -p build-output
        
        # Kopiere buildozer.spec für eventuelle Modifikationen
        cp buildozer.spec buildozer.spec.backup

    - name: 📋 Update buildozer.spec for Docker build
      run: |
        # Optimierungen für Docker-Build - Verwende robuste sed-Syntax
        sed -i 's|android\.accept_sdk_license = .*|android.accept_sdk_license = True|' buildozer.spec
        sed -i 's|android\.skip_update = .*|android.skip_update = False|' buildozer.spec
        
        # KivyMD ist bereits als GitHub-URL in requirements enthalten
        echo "📋 KivyMD wird als GitHub master.zip geladen"
        
        # Aktualisiere Version mit Timestamp für eindeutige Builds
        VERSION=$(grep "version = " buildozer.spec | cut -d' ' -f3 | tr -d ' ')
        NEW_VERSION="${VERSION}.$(date +%m%d%H%M)"
        sed -i "s|version = .*|version = ${NEW_VERSION}|" buildozer.spec
        
        echo "📋 buildozer.spec updated for Docker build"
        echo "📋 New version: ${NEW_VERSION}"

    - name: 🐋 Build APK with Official Kivy/Buildozer Docker
      run: |
        echo "🚀 Starting Docker-based Android build..."
        
        # Verwende den offiziellen Kivy Buildozer Docker Container
        docker run --rm \
          --volume "$(pwd)":/home/user/hostcwd \
          --volume ~/.buildozer:/home/user/.buildozer \
          --workdir /home/user/hostcwd \
          --env USER=user \
          --env HOME=/home/user \
          kivy/buildozer:latest \
          bash -c "
            set -e
            echo '🔧 Container setup...'
            
            # Benutzer-Setup (korrekte Pfade für offizielles Docker Image)
            sudo chown -R user:user /home/user/hostcwd || true
            sudo chown -R user:user /home/user/.buildozer || true
            
            # Buildozer Clean für frischen Build (wichtig bei KivyMD master.zip)
            echo '🧹 Cleaning previous builds...'
            buildozer android clean || echo 'Clean completed'
            
            # Android SDK aktualisieren
            echo '📱 Updating Android SDK...'
            yes | buildozer android update 2>/dev/null || echo 'SDK update completed'
            
            # APK Build
            echo '🔨 Building APK...'
            buildozer android ${{ env.BUILD_MODE }} --verbose
            
            # Build-Info
            echo '📋 Build completed!'
            ls -la bin/ || echo 'No bin directory'
          "

    - name: 🐋 Alternative Docker Build (Fallback)
      if: failure()
      run: |
        echo "⚠️  Primary Docker build failed, trying alternative approach..."
        
        # Erstelle eigenes Dockerfile für Build
        cat > Dockerfile.android << 'EOF'
        FROM ubuntu:22.04
        
        # System dependencies
        RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3 \
            python3-pip \
            python3-venv \
            build-essential \
            git \
            unzip \
            openjdk-11-jdk \
            wget \
            libffi-dev \
            libssl-dev \
            && rm -rf /var/lib/apt/lists/*
        
        # Environment
        ENV JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
        ENV ANDROID_HOME=/opt/android-sdk
        ENV PATH=$PATH:$ANDROID_HOME/tools:$ANDROID_HOME/platform-tools
        
        # Install buildozer
        RUN python3 -m pip install --upgrade pip wheel setuptools
        RUN python3 -m pip install buildozer cython
        
        # Create working directory
        WORKDIR /app
        
        # Copy project
        COPY . .
        
        # Build command
        CMD ["python3", "-m", "buildozer", "android", "debug"]
        EOF
        
        # Build mit eigenem Dockerfile
        docker build -f Dockerfile.android -t savage-worlds-builder .
        docker run --rm \
          -v "$(pwd)/build-output":/app/bin \
          savage-worlds-builder \
          bash -c "buildozer android ${{ env.BUILD_MODE }} --verbose && cp bin/* /app/bin/ 2>/dev/null || true"

    - name: 📊 Analyze build results
      run: |
        echo "📋 Build analysis:"
        
        # Suche nach APK files in verschiedenen Locations
        find . -name "*.apk" -type f 2>/dev/null | while read apk; do
          echo "🎯 Found APK: $apk"
          echo "   Size: $(du -h "$apk" | cut -f1)"
          echo "   Location: $(dirname "$apk")"
          
          # Kopiere zur Standard-Location
          mkdir -p bin
          cp "$apk" "bin/$(basename "$apk")"
        done
        
        # Zeige finale Ergebnisse
        echo "📱 Final APK location:"
        ls -lah bin/*.apk 2>/dev/null || echo "❌ No APK files found in bin/"
        
        # Zusätzliche Build-Artefakte
        echo "📂 Build artifacts:"
        ls -la build-output/ 2>/dev/null || echo "No build-output directory"

    - name: ✅ Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: savage-worlds-docker-${{ env.BUILD_MODE }}-${{ env.TIMESTAMP }}
        path: |
          bin/*.apk
          bin/*.aab
          build-output/*.apk
        retention-days: 30
        if-no-files-found: warn

    - name: 📋 Upload detailed logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: docker-build-logs-${{ env.TIMESTAMP }}
        path: |
          .buildozer/logs/
          buildozer.log
          buildozer.spec
          buildozer.spec.backup
        retention-days: 7
        if-no-files-found: ignore

    - name: 🎯 Docker Build Summary
      if: always()
      run: |
        echo "## 🐋 Docker Android Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        APK_COUNT=$(find . -name "*.apk" -type f 2>/dev/null | wc -l)
        
        if [ "$APK_COUNT" -gt 0 ]; then
          echo "✅ **Build Status:** Success" >> $GITHUB_STEP_SUMMARY
          echo "📱 **APK Count:** $APK_COUNT" >> $GITHUB_STEP_SUMMARY
          
          find . -name "*.apk" -type f 2>/dev/null | while read apk; do
            APK_SIZE=$(du -h "$apk" | cut -f1)
            APK_NAME=$(basename "$apk")
            echo "📦 **APK:** $APK_NAME ($APK_SIZE)" >> $GITHUB_STEP_SUMMARY
          done
        else
          echo "❌ **Build Status:** Failed" >> $GITHUB_STEP_SUMMARY
          echo "📱 **APK Created:** No" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🐋 **Docker Build Details:**" >> $GITHUB_STEP_SUMMARY
        echo "- Image: kivy/buildozer:latest" >> $GITHUB_STEP_SUMMARY
        echo "- Mode: ${{ env.BUILD_MODE }}" >> $GITHUB_STEP_SUMMARY
        echo "- Cache Used: ${{ github.event.inputs.use_cache }}" >> $GITHUB_STEP_SUMMARY
        echo "- Timestamp: ${{ env.TIMESTAMP }}" >> $GITHUB_STEP_SUMMARY