name: Build Android APK - Reliable

on:
  push:
    branches: [ dev_unstable ]
    paths:
      - 'buildozer.spec'
      - 'buildozer-minimal.spec'
      - '**.py'
      - '.github/workflows/android-reliable.yml'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release

jobs:
  build-reliable:
    runs-on: ubuntu-latest
    
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    
    steps:
    - name: 📱 Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: ☕ Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: 🔧 Install essential dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          unzip \
          wget \
          python3-pip \
          python3-venv \
          libffi-dev \
          libssl-dev \
          libbz2-dev \
          libsqlite3-dev \
          libncurses5-dev \
          libncursesw5-dev \
          xz-utils \
          tk-dev \
          libxml2-dev \
          libxmlsec1-dev \
          libffi-dev \
          liblzma-dev

    - name: 📱 Install Android SDK
      run: |
        # Download and install Android SDK
        mkdir -p ${{ github.workspace }}/android-sdk/cmdline-tools
        cd ${{ github.workspace }}/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
        unzip -q commandlinetools-linux-10406996_latest.zip
        mv cmdline-tools latest
        
        # Add to PATH
        echo "${{ github.workspace }}/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "${{ github.workspace }}/android-sdk/platform-tools" >> $GITHUB_PATH
        
        # Accept licenses and install required packages
        yes | ${{ github.workspace }}/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        ${{ github.workspace }}/android-sdk/cmdline-tools/latest/bin/sdkmanager --update
        ${{ github.workspace }}/android-sdk/cmdline-tools/latest/bin/sdkmanager \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2" \
          "ndk;28.2.13676358"

    - name: 🏗️ Install Buildozer
      run: |
        python -m pip install --upgrade pip
        pip install buildozer==1.5.0 cython

    - name: 🔨 Build APK with Buildozer
      id: buildozer
      run: |
        # Build the APK
        buildozer android ${{ github.event.inputs.build_mode || 'debug' }}
        
        # Find the generated APK
        APK_FILE=$(find bin/ -name "*.apk" | head -1)
        echo "filename=$APK_FILE" >> $GITHUB_OUTPUT

    - name: ✅ Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: savage-worlds-reliable-${{ github.event.inputs.build_mode || 'debug' }}-${{ github.run_number }}
        path: ${{ steps.buildozer.outputs.filename }}
        retention-days: 30

    - name: 📋 Upload build logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: reliable-build-logs-${{ github.run_number }}
        path: |
          .buildozer/logs/
          buildozer.log
        retention-days: 7
        if-no-files-found: ignore

    - name: 📊 Build Summary
      if: always()
      run: |
        echo "## 🔨 Reliable Android Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "${{ steps.buildozer.outputs.filename }}" ]; then
          APK_SIZE=$(du -h "${{ steps.buildozer.outputs.filename }}" | cut -f1)
          APK_NAME=$(basename "${{ steps.buildozer.outputs.filename }}")
          echo "✅ **Build Status:** Success" >> $GITHUB_STEP_SUMMARY
          echo "📱 **APK:** $APK_NAME ($APK_SIZE)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Build Status:** Failed" >> $GITHUB_STEP_SUMMARY
          echo "📱 **APK Created:** No" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔧 **Build Method:** ArtemSBulgakov/buildozer-action@v1" >> $GITHUB_STEP_SUMMARY
        echo "📋 **Mode:** ${{ github.event.inputs.build_mode || 'debug' }}" >> $GITHUB_STEP_SUMMARY
        echo "🏗️ **Buildozer:** 1.5.0" >> $GITHUB_STEP_SUMMARY