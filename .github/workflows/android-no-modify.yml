name: Build Android APK - No Modifications

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release

jobs:
  build-no-modify:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📱 Checkout repository
      uses: actions/checkout@v4

    - name: 🔧 Install minimal dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -f
        sudo apt-get install -y \
          libunwind-dev \
          build-essential \
          git \
          unzip \
          openjdk-11-jdk \
          python3-pip

    - name: 📋 Validate buildozer.spec (no modifications)
      run: |
        echo "📋 Current buildozer.spec:"
        head -20 buildozer.spec
        echo "..."
        echo "📋 Requirements:"
        grep "^requirements" buildozer.spec || echo "No requirements line found"
        echo "📋 Android settings:"
        grep "^android\." buildozer.spec | head -10 || echo "No android settings found"

    - name: 🐋 Pure Docker Build (no file changes)
      run: |
        echo "🚀 Starting pure Docker build without any modifications..."
        
        # Fix permissions only
        sudo chown -R $USER:$USER .
        mkdir -p ~/.buildozer
        sudo chown -R $USER:$USER ~/.buildozer
        
        # Build with official Docker image using buildozer.spec as-is
        docker run --rm \
          --volume "$(pwd)":/home/user/hostcwd \
          --volume ~/.buildozer:/home/user/.buildozer \
          --workdir /home/user/hostcwd \
          --user user \
          --env HOME=/home/user \
          kivy/buildozer:latest \
          bash -c "
            set -e
            echo '🔧 Container info:'
            echo 'User: \$(whoami)'
            echo 'Home: \$HOME'
            echo 'Working dir: \$(pwd)'
            
            echo '📋 buildozer.spec validation:'
            if [ -f buildozer.spec ]; then
              echo '✅ buildozer.spec found'
              head -5 buildozer.spec
            else
              echo '❌ buildozer.spec not found'
              exit 1
            fi
            
            echo '🧹 Clean previous builds...'
            buildozer android clean || echo 'Clean completed'
            
            echo '📱 Update Android SDK...'
            timeout 300 bash -c 'yes | buildozer android update' 2>/dev/null || echo 'SDK update completed'
            
            echo '🔨 Building APK (no spec modifications)...'
            timeout 1800 buildozer android ${{ github.event.inputs.build_mode || 'debug' }} --verbose
            
            echo '📋 Build results:'
            ls -la bin/ || echo 'No bin directory found'
          "

    - name: ✅ Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: savage-worlds-no-modify-${{ github.event.inputs.build_mode || 'debug' }}-${{ github.run_number }}
        path: bin/*.apk
        retention-days: 30
        if-no-files-found: warn

    - name: 📋 Upload build logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: no-modify-build-logs-${{ github.run_number }}
        path: |
          .buildozer/logs/
          buildozer.log
        retention-days: 7
        if-no-files-found: ignore

    - name: 📊 Build Summary
      if: always()
      run: |
        echo "## 🚫 No-Modify Android Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if ls bin/*.apk >/dev/null 2>&1; then
          echo "✅ **Build Status:** Success" >> $GITHUB_STEP_SUMMARY
          for apk in bin/*.apk; do
            APK_SIZE=$(du -h "$apk" | cut -f1)
            APK_NAME=$(basename "$apk")
            echo "📱 **APK:** $APK_NAME ($APK_SIZE)" >> $GITHUB_STEP_SUMMARY
          done
        else
          echo "❌ **Build Status:** Failed" >> $GITHUB_STEP_SUMMARY
          echo "📱 **APK Created:** No" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔧 **Build Method:** Pure Docker (no modifications)" >> $GITHUB_STEP_SUMMARY
        echo "📋 **Mode:** ${{ github.event.inputs.build_mode || 'debug' }}" >> $GITHUB_STEP_SUMMARY
        echo "🐋 **Image:** kivy/buildozer:latest" >> $GITHUB_STEP_SUMMARY