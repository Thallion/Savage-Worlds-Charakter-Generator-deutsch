name: Build Android APK - Full App

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release
      architecture:
        description: 'Target architectures'
        required: true
        default: 'arm64-v8a,armeabi-v7a'
        type: choice
        options:
        - armeabi-v7a
        - arm64-v8a
        - arm64-v8a,armeabi-v7a
        - x86_64
  push:
    branches: [ main, dev_unstable ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build-android:
    runs-on: ubuntu-22.04
    
    env:
      ANDROID_API: 35
      ANDROID_MIN_API: 21
      NDK_VERSION: 25b
      BUILDOZER_VERSION: 1.5.0
      
    steps:
    - name: 📱 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🐍 Setup Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 🔧 Install system dependencies
      run: |
        sudo apt-get update
        # Fix broken packages and install base dependencies first
        sudo apt-get install -f
        sudo apt-get install -y \
          libunwind-dev \
          build-essential \
          git \
          unzip \
          openjdk-17-jdk \
          dbus
        
        # Install multimedia dependencies  
        sudo apt-get install -y \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good

    - name: ⚙️ Configure environment and setup Android SDK
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "PATH=$PATH:$HOME/android-sdk/cmdline-tools/bin:$HOME/android-sdk/platform-tools" >> $GITHUB_ENV
        
        # Download and setup Android SDK command line tools
        mkdir -p $HOME/android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $HOME/android-sdk/
        mkdir -p $HOME/android-sdk/cmdline-tools/latest
        mv $HOME/android-sdk/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/ 2>/dev/null || true
        
        # Fix permissions for git
        sudo chown -R $USER:$USER .
        sudo chown -R $USER:$USER $HOME/android-sdk

    - name: 📂 Cache Android SDK and buildozer
      uses: actions/cache@v3
      id: cache-android
      with:
        path: |
          ~/.android
          ~/.buildozer
          ~/android-sdk
        key: ${{ runner.os }}-android-${{ env.ANDROID_API }}-${{ env.NDK_VERSION }}-${{ env.BUILDOZER_VERSION }}
        restore-keys: |
          ${{ runner.os }}-android-${{ env.ANDROID_API }}-
          ${{ runner.os }}-android-

    - name: 📦 Install Python dependencies
      run: |
        python -m pip install --upgrade pip wheel setuptools
        pip install \
          buildozer==${{ env.BUILDOZER_VERSION }} \
          cython \
          kivy \
          kivymd \
          pillow \
          reportlab \
          requests

    - name: 📋 Validate buildozer.spec
      run: |
        if [ ! -f buildozer.spec ]; then
          echo "❌ buildozer.spec not found!"
          exit 1
        fi
        
        echo "📋 Checking buildozer.spec configuration..."
        
        # Prüfe und aktualisiere Konfigurationen mit Python (robuster als sed)
        python3 -c "
import re

# Read buildozer.spec
with open('buildozer.spec', 'r') as f:
    content = f.read()

# Update Android API settings
api_version = '${{ env.ANDROID_API }}'
minapi_version = '${{ env.ANDROID_MIN_API }}'
ndk_version = '${{ env.NDK_VERSION }}'
archs = '${{ github.event.inputs.architecture || \"arm64-v8a,armeabi-v7a\" }}'

# Check and update each setting
if not re.search(f'^android\.api = {api_version}$', content, re.MULTILINE):
    print(f'⚠️  Updating Android API to {api_version}')
    if re.search(r'^android\.api = ', content, re.MULTILINE):
        content = re.sub(r'^android\.api = .*', f'android.api = {api_version}', content, flags=re.MULTILINE)
    else:
        content += f'\nandroid.api = {api_version}\n'

if not re.search(f'^android\.minapi = {minapi_version}$', content, re.MULTILINE):
    print(f'⚠️  Updating Android Min API to {minapi_version}')
    if re.search(r'^android\.minapi = ', content, re.MULTILINE):
        content = re.sub(r'^android\.minapi = .*', f'android.minapi = {minapi_version}', content, flags=re.MULTILINE)
    else:
        content += f'\nandroid.minapi = {minapi_version}\n'

if not re.search(f'^android\.ndk = {ndk_version}$', content, re.MULTILINE):
    print(f'⚠️  Updating NDK version to {ndk_version}')
    if re.search(r'^android\.ndk = ', content, re.MULTILINE):
        content = re.sub(r'^android\.ndk = .*', f'android.ndk = {ndk_version}', content, flags=re.MULTILINE)
    else:
        content += f'\nandroid.ndk = {ndk_version}\n'

# Update architectures
if re.search(r'^android\.archs = ', content, re.MULTILINE):
    content = re.sub(r'^android\.archs = .*', f'android.archs = {archs}', content, flags=re.MULTILINE)
else:
    content += f'\nandroid.archs = {archs}\n'

# Write back
with open('buildozer.spec', 'w') as f:
    f.write(content)

print('✅ buildozer.spec configuration updated')
"
        
        echo "✅ buildozer.spec validated and updated"

    - name: 🔍 Check assets and dependencies
      run: |
        echo "📁 Project structure:"
        ls -la
        
        echo "🎨 Assets:"
        if [ -d assets ]; then
          ls -la assets/
        else
          echo "⚠️  Assets directory not found"
        fi
        
        echo "📱 KV files:"
        find . -name "*.kv" -type f | head -10
        
        echo "🐍 Python files:"
        find . -name "*.py" -type f | grep -v __pycache__ | head -10

    - name: 🛠️ Initialize buildozer and setup Android SDK
      run: |
        # Ensure we're not running as root
        if [ "$EUID" -eq 0 ]; then
          echo "⚠️  Running as root - this may cause issues"
        fi
        
        # Create buildozer directories with proper ownership
        mkdir -p ~/.buildozer
        sudo chown -R $USER:$USER ~/.buildozer
        
        # Initialize buildozer (only if needed)
        if [ ! -f buildozer.spec ]; then
          buildozer init
        else
          echo "✅ buildozer.spec already exists"
        fi
        
        # Clean any previous builds
        buildozer android clean || echo "Clean completed"
        
        # Accept Android SDK licenses and update
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        yes | buildozer android update || echo "SDK update completed with warnings"

    - name: 🚀 Build APK with Docker fallback
      run: |
        BUILD_MODE="${{ github.event.inputs.build_mode || 'debug' }}"
        echo "Building in $BUILD_MODE mode..."
        
        # Ensure environment is set up
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        # Primärer Build-Versuch mit besserer Konfiguration
        if timeout 1800 buildozer android $BUILD_MODE --verbose; then
          echo "✅ Direct buildozer build successful!"
        else
          echo "⚠️  Direct build failed, trying Docker approach..."
          
          # Docker-basierter Build als Fallback mit non-root user
          docker run --rm \
            -v "$(pwd)":/home/user/hostcwd \
            -v ~/.buildozer:/home/user/.buildozer \
            -w /home/user/hostcwd \
            -u $(id -u):$(id -g) \
            -e HOME=/home/user \
            kivy/buildozer:latest \
            bash -c "
              sudo chown -R user:user /home/user/hostcwd /home/user/.buildozer 2>/dev/null || true
              buildozer android clean
              buildozer android $BUILD_MODE --verbose
            " || {
              echo "❌ Both build methods failed"
              exit 1
            }
        fi

    - name: 📊 Analyze build results
      run: |
        echo "📋 Build results:"
        
        if [ -d bin ]; then
          echo "📱 APK files in bin/:"
          ls -lah bin/*.apk || echo "No APK files found"
          
          # Prüfe APK Größe und Details
          for apk in bin/*.apk; do
            if [ -f "$apk" ]; then
              echo "📱 APK: $(basename "$apk")"
              echo "   Size: $(du -h "$apk" | cut -f1)"
              echo "   Type: $(file "$apk")"
            fi
          done
        else
          echo "❌ bin/ directory not found"
          ls -la
        fi

    - name: ✅ Upload APK Artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: savage-worlds-android-${{ github.event.inputs.build_mode || 'debug' }}-${{ github.run_number }}
        path: |
          bin/*.apk
          bin/*.aab
        retention-days: 30

    - name: 📋 Upload build logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: buildozer-logs-${{ github.run_number }}
        path: |
          .buildozer/logs/
          buildozer.log
        retention-days: 7

    - name: 🎯 Build Summary
      if: always()
      run: |
        echo "## 📱 Android Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f bin/*.apk ]; then
          echo "✅ **Build Status:** Success" >> $GITHUB_STEP_SUMMARY
          echo "📱 **APK Created:** Yes" >> $GITHUB_STEP_SUMMARY
          
          for apk in bin/*.apk; do
            if [ -f "$apk" ]; then
              APK_SIZE=$(du -h "$apk" | cut -f1)
              APK_NAME=$(basename "$apk")
              echo "📦 **APK:** $APK_NAME ($APK_SIZE)" >> $GITHUB_STEP_SUMMARY
            fi
          done
        else
          echo "❌ **Build Status:** Failed" >> $GITHUB_STEP_SUMMARY
          echo "📱 **APK Created:** No" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔧 **Build Configuration:**" >> $GITHUB_STEP_SUMMARY
        echo "- Mode: ${{ github.event.inputs.build_mode || 'debug' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Architecture: ${{ github.event.inputs.architecture || 'arm64-v8a,armeabi-v7a' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Android API: ${{ env.ANDROID_API }}" >> $GITHUB_STEP_SUMMARY
        echo "- Min API: ${{ env.ANDROID_MIN_API }}" >> $GITHUB_STEP_SUMMARY
        echo "- NDK: ${{ env.NDK_VERSION }}" >> $GITHUB_STEP_SUMMARY